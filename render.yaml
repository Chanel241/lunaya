databases:
  - name: lunaya-db
    databaseName: lunaya
    user: lunaya_user
    plan: free
services:
  - type: web
    name: lunaya
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn lunaya.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lunaya-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"  # Pour le mode développement
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"  # Autorise le domaine Render
    autoDeploy: true
    regions:
      - oregon  # Région par défaut, ajuste si besoin
    plan: free