databases:
  - name: lunaya-db
    databaseName: lunaya
    user: lunaya_user
    plan: free
services:
  - type: web
    name: lunaya
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT config.wsgi:application"  # Corrige le nom du module
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lunaya-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"  # Pour le mode développement
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"  # Autorise le domaine Render
      - key: PORT
        value: "10000"  # Port par défaut de Render
    autoDeploy: true
    plan: free