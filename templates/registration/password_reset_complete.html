{% extends "base.html" %}
{% block content %}
<div class="card p-4 shadow-sm mx-auto" style="max-width: 500px; background-color: #f8f9fa;">
    <h2 class="card-title text-center">Réinitialisation terminée</h2>
    <p class="card-text text-center">Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant <a href="{% url 'login' %}">vous connecter</a>.</p>
</div>
<style>
    .card {
        transition: transform 0.3s ease; 
    }
    .card:hover {
        transform: scale(1.02); /* Effet de zoom subtil */
    }
    a {
        color: #007bff; 
        font-weight: bold; 
        text-decoration: none;
        background-color: transparent; 
    }
    a:hover {
        text-decoration: underline; 
    }
</style>
{% endblock %}
