{% extends 'base.html' %}
{% block title %}Supprimer une méditation - Lunaya{% endblock %}
{% block content %}
  <div style="margin-top: 2rem; display: flex; justify-content: center; align-items: center; min-height: 50vh;">
    <div class="card" style="max-width: 600px; width: 100%; background-color: #fff; border-radius: 12px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); transition: all 0.3s ease; padding: 1rem;">
      <div class="card-body">
        <h2 style="text-align: center; color: #8b5e83;">Confirmer la suppression <i class="fa fa-trash" style="color: #8b5e83;"></i></h2>
        <p style="text-align: center; color: #8c8dd8;">Êtes-vous sûr de vouloir supprimer "{{ meditation.title }}" ? Cette action est irréversible.</p>
        <form method="post" style="margin-top: 1rem; text-align: center;">
          {% csrf_token %}
          <button type="submit" style="background-color: #dc3545; color: white; padding: 0.75rem 1.5rem; border-radius: 12px; border: none; transition: background-color 0.3s ease;">Confirmer la suppression</button>
          <br>
          <a href="{% url 'meditation_list' %}" style="margin-left: 1rem; color: #007bff; text-decoration: none; margin-top: 1rem; display: inline-block;">Annuler</a>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
