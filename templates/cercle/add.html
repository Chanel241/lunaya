{% extends 'base.html' %}
{% load static %}

{% block title %}
    Ajouter un Message
{% endblock %}

{% block content %}
    <h2>Ajouter un Message <i class="fa fa-pen"></i></h2>
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
    <form method="post" action="{% url 'cercle_add' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Publier</button>
    </form>
    <a href="{% url 'community' %}">Retour au Cercle</a>
{% endblock %}
